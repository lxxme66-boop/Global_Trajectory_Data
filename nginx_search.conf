# Nginx 负载均衡配置 - 搜索服务
# 文件位置：/etc/nginx/conf.d/search.conf

upstream search_backend {
    # 负载均衡策略：最少连接数
    least_conn;
    
    # 4 个搜索进程后端
    server 127.0.0.1:9511 max_fails=3 fail_timeout=30s weight=1;
    server 127.0.0.1:9512 max_fails=3 fail_timeout=30s weight=1;
    server 127.0.0.1:9513 max_fails=3 fail_timeout=30s weight=1;
    server 127.0.0.1:9514 max_fails=3 fail_timeout=30s weight=1;
    
    # 保持连接
    keepalive 32;
}

server {
    listen 9510;
    server_name _;
    
    # 访问日志
    access_log /var/log/nginx/search_access.log;
    error_log /var/log/nginx/search_error.log;
    
    # 搜索服务
    location /api-rqa-search/ {
        proxy_pass http://search_backend;
        
        # 超时配置（300秒 = 5分钟）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # HTTP 头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 禁用缓冲（实时响应）
        proxy_buffering off;
        
        # 请求体大小限制
        client_max_body_size 10M;
        
        # 保持连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # 健康检查
    location /api-rqa-search/test {
        proxy_pass http://search_backend;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }
    
    # 统计信息
    location /api-rqa-search/stats {
        proxy_pass http://search_backend;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }
    
    # Nginx 状态监控（可选）
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
